[tool.poetry]

name = "minilog"
version = "2.4"
description = "Minimalistic wrapper for Python logging."

license = "MIT"

authors = ["Jace Browning <jacebrowning@gmail.com>"]

readme = "README.md"
packages = [{ include = "log" }]

homepage = "https://pypi.org/project/minilog"
documentation = "https://minilog.readthedocs.io"
repository = "https://github.com/jacebrowning/minilog"

keywords = ["logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: System :: Logging",
]

[tool.poetry.dependencies]

python = "^3.11"

[tool.poetry.group.dev.dependencies]

# Formatters
black = ">=24.3,<27.0"
isort = ">=5.10,<10.0"

# Linters
pylint = "^4.0"
pydocstyle = "*"
mypy = "^2.4"
types-freezegun = "*"

# Testing
pytest = ">=8,<10"
pytest-describe = ">=2,<4"
pytest-expecter = "^3.0"
pytest-ordering = "*"
pytest-cov = ">=4.1,<8.0"
pytest-repeat = "*"
pytest-profiling = "*"
freezegun = "*"

# Reports
coveragespace = "^6.0.1"

# Documentation
mkdocs = "^1.6"
pygments = "^2.15.0"

# Tooling
pyinstaller = "*"
sniffer = "*"
MacFSEvents = { version = "*", platform = "darwin" }
pync = { version = "*", platform = "darwin" }
ipython = ">=7.16.3,<10.0.0"

[tool.poetry.requires-plugins]

poetry-plugin-export = ">=1.8"

[tool.black]

quiet = true

[tool.isort]

profile = "black"

[tool.mypy]

ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

cache_dir = ".cache/mypy/"

[tool.pytest.ini_options]

addopts = """
--strict-markers

-r sxX
--show-capture=log

--cov-report=html
--cov-report=term-missing:skip-covered
--no-cov-on-fail
"""

cache_dir = ".cache/pytest/"

markers = ["first", "last"]

[build-system]

requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
